# Updated docker-compose.yml with properly configured monitoring
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echat-backend
    ports:
      - "127.0.0.1:8000:8000"  # API server
      - "127.0.0.1:8001:8001"  # Metrics endpoint
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data:rw           # Persistent data directory (contains db/)
      - chroma_data:/app/data/chroma_db:rw # Persistent chroma database
      - hf_cache:/root/.cache/huggingface:rw  # Persistent HuggingFace model cache
      - easyocr_cache:/root/.EasyOCR:rw       # Persistent EasyOCR model cache
      - docling_cache:/root/.cache/docling:rw # Persistent Docling model cache
    environment:
      - PYTHONUNBUFFERED=1
      - PIP_DEFAULT_TIMEOUT=100
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_DB_PATH=/app/data/chroma_db
      - SQLITE_DB_PATH=/app/data/db/main.db
      - DOCUMENT_DB_PATH=/app/data/db/documents.db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_user
      - MINIO_SECRET_KEY=minio_password
      - MINIO_SECURE=false
      - MINIO_BUCKET=documents
      - HOST_IP=0.0.0.0
      - UVICORN_TIMEOUT=600
      - REQUEST_TIMEOUT=600
      - METRICS_PORT=8001
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_metrics
      - HF_HOME=/root/.cache/huggingface        # HuggingFace cache directory
      - TRANSFORMERS_CACHE=/root/.cache/huggingface  # Transformers cache
      - EASYOCR_MODULE_PATH=/root/.EasyOCR      # EasyOCR cache directory
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}  # HuggingFace authentication token
      - HF_HUB_DISABLE_PROGRESS_BARS=0  # Enable HuggingFace download progress bars
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
    networks:
      - echat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: bash init_ollama.sh
    depends_on:
      - ollama
      - minio
      - redis
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Ensure the container runs with permissions to modify volume data
    user: "0:0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echat-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=/api
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - echat-network
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: echat-ollama
    ports:
      - "127.0.0.1:11434:11434"
    privileged: true
    volumes:
      - ollama_data:/root/.ollama
      - /usr/lib/x86_64-linux-gnu/nvidia:/usr/lib/x86_64-linux-gnu/nvidia:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.560.35.03:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libcuda.so.560.35.03:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - /usr/local/cuda:/usr/local/cuda:ro
      - /usr/local/nvidia:/usr/local/nvidia:ro
      - /dev:/dev:ro
    networks:
      - echat-network
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_MAX_QUEUE=128
      - OLLAMA_MAX_VRAM=8192
      - MLOCK_LIMIT=0
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-caps:/dev/nvidia-caps
    restart: unless-stopped
    shm_size: 4g
    ulimits:
      memlock:
        soft: -1
        hard: -1



  redis:
    image: redis:7-alpine
    container_name: echat-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - echat-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echat-celery-worker
    working_dir: /app
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data:rw           # Persistent data directory (contains db/)
      - chroma_data:/app/data/chroma_db:rw
      - hf_cache:/root/.cache/huggingface:rw
      - easyocr_cache:/root/.EasyOCR:rw
      - docling_cache:/root/.cache/docling:rw
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_DB_PATH=/app/data/chroma_db
      - SQLITE_DB_PATH=/app/data/db/main.db
      - DOCUMENT_DB_PATH=/app/data/db/documents.db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_user
      - MINIO_SECRET_KEY=minio_password
      - MINIO_SECURE=false
      - MINIO_BUCKET=documents
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - EASYOCR_MODULE_PATH=/root/.EasyOCR
    networks:
      - echat-network
    depends_on:
      - redis
      - ollama
      - minio
    restart: unless-stopped
    command: python -m celery -A app.workers.celery_app worker --loglevel=info --pool=gevent --concurrency=4 --queues=celery,evaluation
    healthcheck:
      test: ["CMD", "python", "-m", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "0:0"

  minio:
    image: quay.io/minio/minio:latest
    container_name: echat-minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      - MINIO_ROOT_USER=minio_user
      - MINIO_ROOT_PASSWORD=minio_password
      - MINIO_ADDRESS=:9000
      - MINIO_CONSOLE_ADDRESS=:9001
    volumes:
      - minio_data:/data
    networks:
      - echat-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  echat-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
  ollama_data:
    driver: local
  minio_data:
    driver: local
  chroma_data:
    driver: local
  hf_cache:
    driver: local
  easyocr_cache:
    driver: local
  docling_cache:
    driver: local
  redis_data:
    driver: local